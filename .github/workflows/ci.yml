name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check generated skill command reference
        run: make skill-check
      - name: Check formatting
        run: make fmt-check
      - name: Vet
        run: make vet
      - name: Test with race detector
        run: make test-race
      - name: Test build shell portability
        run: make test-build-portability
      - name: Build with version metadata
        env:
          VERSION: ci-${{ github.sha }}
        run: make build
      - name: Verify injected version
        env:
          VERSION: ci-${{ github.sha }}
        run: test "$(./exp --version)" = "exp version ${VERSION}"

  cross-build:
    name: Cross-build only (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            suffix: .exe
          - goos: aix
            goarch: ppc64
            suffix: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Cross-build CLI
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -o "$RUNNER_TEMP/exp-${GOOS}-${GOARCH}${{ matrix.suffix }}" ./cmd/exp
      - name: Cross-compile skill tests (not run)
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go test -c -o "$RUNNER_TEMP/skill-${GOOS}-${GOARCH}${{ matrix.suffix }}" ./internal/skill
