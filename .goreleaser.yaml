version: 2
project_name: exp-cli
before:
  hooks:
    - python3 scripts/release.py completions --project exp-cli --binary exp --main ./cmd/exp
builds:
  - id: exp
    main: ./cmd/exp
    binary: exp
    env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath, -buildvcs=false]
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w -X github.com/daviddwlee84/exp-cli/internal/cli.Version={{ .Tag }}
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds_info:
      mtime: "{{ .CommitDate }}"
    files:
      - src: LICENSE
        info:
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: completions/*
        info:
          mode: 0644
          mtime: "{{ .CommitDate }}"
checksum:
  name_template: checksums.txt
release:
  draft: true

# Rootless, filtered by the committed .gitattributes rules.
source:
  enabled: true
  name_template: "{{ .ProjectName }}_{{ .Version }}_source"
  format: tar.gz
