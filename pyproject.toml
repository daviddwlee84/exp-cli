[project]
name = "exp-cli-docs"
version = "0.0.0"
description = "Docs build environment for exp"
requires-python = ">=3.11"

[project.optional-dependencies]
docs = [
    # Keep the plugin-based stack on MkDocs 1.x / Material 9.x.
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5,<10",
    "mkdocs-static-i18n>=1.3,<2",
    "pymdown-extensions>=10.7",
]
